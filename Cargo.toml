[workspace]
members = [
  "crates/archive-core",
  "crates/archive",
  "crates/note-core",
  "crates/assurance-core",
  "crates/documents",
  "src-tauri",
  "xtask",
]
exclude = ["verification", "fuzz"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = [
  "cfg(kani)",
  "cfg(mobile)",
  "cfg(desktop)",
] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
