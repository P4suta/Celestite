[package]
name = "celestite-documents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
celestite-archive = { path = "../archive" }
celestite-archive-core = { path = "../archive-core" }
celestite-core = { path = "../note-core" }
idna = "=1.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
percent-encoding = "2"
url = "2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }

[lints]
workspace = true
