[package]
name = "celestite-archive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
celestite-archive-core = { path = "../archive-core" }
celestite-core = { path = "../note-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
tempfile = "3"
thiserror = "2"
pulldown-cmark = { version = "=0.13.5", default-features = false }
percent-encoding = "2"
rusqlite = { version = "=0.41.0", features = ["bundled"] }

[lints]
workspace = true
